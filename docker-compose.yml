# 网关和面板跑在容器里，Ollama 在宿主机原生跑（macOS 上容器摸不到 GPU）。
#
#   同事的程序 ──> :8000 网关容器 ─┐
#                                  ├─> host.docker.internal:11434 ─> 宿主机 Ollama
#   同事的浏览器 ─> :8501 面板容器 ─┘
#                        └─ 两个容器共享命名卷 hubdata 里的 SQLite
#
# host.docker.internal 由 Docker Desktop 从宿主机侧代理，所以 Ollama
# 可以继续只监听 127.0.0.1，不用对局域网敞开。
# 注意：这是 Docker Desktop for Mac/Windows 的行为，Linux 上不成立。

services:
  proxy:
    build: .
    image: ollama-ocr-hub
    command: python proxy.py
    ports:
      # 宿主机 8000 被别的项目占了，对外改用 8010；容器内仍是 8000
      - "8010:8000"
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OCR_HUB_DB: /data/hub.db
      OCR_HUB_BIND: 0.0.0.0
      # 容器默认 UTC，会让面板的「今日」按 UTC 零点划界（北京时间早上 8 点才归零）
      TZ: Asia/Shanghai
    volumes:
      - hubdata:/data
    restart: unless-stopped

  panel:
    build: .
    image: ollama-ocr-hub
    command: streamlit run app.py
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      # 面板不再走 127.0.0.1 找网关，改用 compose 网络里的服务名
      OCR_HUB_PROXY_URL: http://proxy:8000
      # 宿主机原生指标服务，显示 Mac 而不是 Docker Linux VM 的资源
      OCR_HUB_METRICS_URL: http://host.docker.internal:9105
      # 面板给同事展示的示例地址要写宿主机上实际发布的端口
      OCR_HUB_PORT: "8010"
      OCR_HUB_DB: /data/hub.db
      TZ: Asia/Shanghai
    volumes:
      - hubdata:/data
    restart: unless-stopped
    depends_on:
      - proxy

volumes:
  hubdata:
